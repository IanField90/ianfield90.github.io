<script>
  (() => {
    const key = 'site-theme';
    const root = document.documentElement;
    const isOverride = (theme) => theme === 'light' || theme === 'dark';
    let theme = 'system';

    try {
      const saved = localStorage.getItem(key);
      if (isOverride(saved)) theme = saved;
    } catch (error) {
      if (!(error instanceof DOMException)) throw error;
      console.warn('Could not read the theme preference.', error);
    }

    function applyTheme() {
      if (isOverride(theme)) root.dataset.theme = theme;
      else delete root.dataset.theme;
    }

    applyTheme();

    document.addEventListener('DOMContentLoaded', () => {
      const select = document.getElementById('site-theme');
      select.value = theme;
      select.addEventListener('change', () => {
        theme = select.value;
        applyTheme();

        try {
          if (isOverride(theme)) localStorage.setItem(key, theme);
          else localStorage.removeItem(key);
        } catch (error) {
          if (!(error instanceof DOMException)) throw error;
          console.warn('Could not save the theme preference.', error);
        }
      });
      select.parentElement.hidden = false;
    });
  })();
</script>
